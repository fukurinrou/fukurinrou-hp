    const menu=cloneJson(base&&base.length?base:DEFAULT_MENU);
    const bySectionId=new Map(menu.filter(s=>s.sectionId).map(s=>[s.sectionId,s]));
    (V3.specialSections||[]).forEach(src=>{
      const sid=src.sectionId || ("special:"+src.cat);
      let target=bySectionId.get(sid);
      if(!target){target=cloneJson(src);target.sectionId=sid;menu.push(target);bySectionId.set(sid,target);}
      else{
        if(!target.availability) target.availability=src.availability;
        if(!target.note) target.note=src.note;
        const ids=new Set((target.items||[]).map(i=>i.id));
        (src.items||[]).forEach(it=>{if(!ids.has(it.id))target.items.push(cloneJson(it));});
      }
    });
    menu.forEach(sec=>(sec.items||[]).forEach(it=>{
      const explicit=(V3.itemImageMap||{})[it.id];
      const fallback=(V3.categoryFallback||{})[sec.cat]||{src:"assets/chinese_placeholder.webp",exact:false};
      const img=explicit||fallback;
      if(!it.image)it.image=img.src;
      if(typeof it.imageExact==="undefined")it.imageExact=!!img.exact;
    }));
    return menu;
  }
  function hmToMinutes(v,fallback){if(!v||!/^\d{1,2}:\d{2}$/.test(v))return fallback;const [h,m]=v.split(":").map(Number);return h*60+m}
  function japanMinutesNow(){const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());const h=Number(parts.find(p=>p.type==="hour")?.value||0),m=Number(parts.find(p=>p.type==="minute")?.value||0);return h*60+m}
  function currentServiceMode(){const now=japanMinutesNow(),ls=hmToMinutes(SCHEDULE.lunchStart,660),le=hmToMinutes(SCHEDULE.lunchEnd,900),ds=hmToMinutes(SCHEDULE.dinnerStart,1020);if(now>=ls&&now<le)return"lunch";if(now>=ds)return"dinner";return"regular"}
  function serviceText(){const mode=currentServiceMode();if(mode==="lunch")return{label:"昼メニュー販売中",note:`${SCHEDULE.lunchStart||"11:00"}〜${SCHEDULE.lunchEnd||"15:00"}は昼限定メニューを表示しています。`};if(mode==="dinner")return{label:"夜メニュー販売中",note:`${SCHEDULE.dinnerStart||"17:00"}以降は夜限定メニューを表示しています。`};return{label:"通常メニュー",note:`昼限定は${SCHEDULE.lunchStart||"11:00"}〜${SCHEDULE.lunchEnd||"15:00"}、夜限定は${SCHEDULE.dinnerStart||"17:00"}〜です。`}}
  function visibleSections(){const mode=currentServiceMode();const allowed=state.menu.filter(sec=>!sec.availability||sec.availability===mode);return[...allowed.filter(sec=>sec.availability===mode),...allowed.filter(sec=>!sec.availability)]}
  function normalizedChoice(ch){return typeof ch==="string"?{label:ch,delta:0}:{label:String(ch.label??""),delta:Number(ch.delta||0)}}
  function deltaText(n){return n>0?`+¥${n.toLocaleString()}`:n<0?`-¥${Math.abs(n).toLocaleString()}`:""}
  function optionMinDelta(opts){return (opts||[]).reduce((sum,op)=>{const ds=(op.choices||[]).map(ch=>normalizedChoice(ch).delta);return sum+(ds.length?Math.min(...ds):0)},0)}

  const OPTION_PRESETS = {
    zensai_koushuiji:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    main1_ikatoubanjan:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    main1_hoikoro:[{name:"辛さ",choices:["控えめ","普通","辛め"],default:"普通"}],
    main1_malanabe:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    main1_mapotofu:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    main2_porkspicy:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    main2_sanshochicken:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    main2_yuxiangrousi:[{name:"辛さ",choices:["控えめ","普通","辛め"],default:"普通"}],
    main2_sichuanebi:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    veg_maponasu:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    veg_mapoharusame:[{name:"辛さ",choices:["控えめ","普通","辛め","激辛"],default:"普通"}],
    soup_suuratan:[{name:"辛さ",choices:["控えめ","普通","辛め"],default:"普通"}],
    soup_suuratan_small:[{name:"辛さ",choices:["控えめ","普通","辛め"],default:"普通"}]
  };
  function itemOptions(it){ return [...(it.options||[]), ...(OPTION_PRESETS[it.id]||[])]; }
  function optionText(selections,note){
    const parts=Object.entries(selections||{}).map(([k,v])=>`${k}：${v}`);
    if(note) parts.push(`要望：${note}`);
    return parts.join(" / ");
  }

  let MENU_INDEX={}; function rebuildIndex(menu){ MENU_INDEX={}; menu.forEach(sec=>sec.items.forEach(it=>MENU_INDEX[it.id]=it)); }
  const state={menu:[],activeCat:"",cart:{},screen:"menu",lastOrderId:null,serviceMode:""}; const app=document.getElementById("app");
  function lineKey(id,selections,note){return id+"::"+JSON.stringify(selections||{})+"::"+(note||"");}
  function cartLines(){return Object.values(state.cart)}
  function cartCount(){return cartLines().reduce((s,l)=>s+l.qty,0)}
  function cartTotal(){return cartLines().reduce((s,l)=>s+l.price*l.qty,0)}
  function itemCartQty(id){return cartLines().filter(l=>l.id===id).reduce((s,l)=>s+l.qty,0)}
  function addCartLine(it,selections={},note="",priceDelta=0){const key=lineKey(it.id,selections,note);const unitPrice=Math.max(0,Number(it.price||0)+Number(priceDelta||0));if(!state.cart[key])state.cart[key]={id:it.id,name:it.name,price:unitPrice,qty:0,selections:{...selections},note:note||"",optionText:optionText(selections,note)};state.cart[key].qty++;renderCustomer();}
  function addSimple(it){addCartLine(it,{},"")}
  function removeSimple(it){const key=lineKey(it.id,{},""); if(!state.cart[key])return; state.cart[key].qty--; if(state.cart[key].qty<=0)delete state.cart[key]; renderCustomer();}
  async function loadMenu(){try{const snap=await db.ref("menu").once("value");if(snap.exists())return mergeMenuV3(snap.val());}catch(e){console.error(e)}return mergeMenuV3(DEFAULT_MENU);}
  async function createOrder(order){try{await db.ref(`orders/${order.id}`).set(order);return true}catch(e){console.error(e);return false}}
  function renderCustomer(){const w=document.createElement("div");w.className="cust-wrap";if(state.screen==="confirmed"){w.appendChild(renderConfirm());app.replaceChildren(w);return}if(state.screen==="review"){w.appendChild(renderHeader());w.appendChild(renderReview());app.replaceChildren(w);return}w.appendChild(renderHeader());w.appendChild(renderTabs());w.appendChild(renderMenu());app.replaceChildren(w);if(cartCount()>0)app.appendChild(renderCartBar());}
  function renderHeader(){const d=document.createElement("div");d.className="cust-header";const st=serviceText();d.innerHTML=`<div class="brand-kicker">中国料理</div>
<h1>福林楼</h1>
<div class="sub">お好きな料理を選んでご注文ください</div>
<div class="service-banner">
<span class="service-dot">
</span>
<strong>${st.label}</strong>
</div>
<div class="service-note">${st.note}</div>
<div class="brand-seal">福</div>`;return d}
  function renderTabs(){const secs=visibleSections();if(!secs.some(x=>x.cat===state.activeCat))state.activeCat=secs[0]?.cat||"";const d=document.createElement("div");d.className="cat-tabs";d.innerHTML=secs.map(sec=>`<button class="cat-tab ${sec.cat===state.activeCat?'active':''}" data-special="${sec.availability?1:0}" data-cat="${sec.cat}">${sec.cat}</button>`).join("");d.querySelectorAll(".cat-tab").forEach(b=>b.onclick=()=>{state.activeCat=b.dataset.cat;document.getElementById(`sec-${b.dataset.cat}`)?.scrollIntoView({behavior:"smooth",block:"start"})});return d}
  function renderMenu(){const secs=visibleSections();const d=document.createElement("div");d.className="menu-section";d.innerHTML=secs.map(sec=>`<div id="sec-${sec.cat}" class="${sec.availability?'special-top':''}">
<div class="section-head">
<h3>${escapeHtml(sec.cat)}${sec.availability?`<span class="availability-chip">${sec.availability==='lunch'?'昼限定':'夜限定'}</span>`:""}</h3>${sec.note?`<div class="section-note">${escapeHtml(sec.note)}</div>`:""}</div>${(sec.items||[]).map(it=>{const opts=itemOptions(it),q=itemCartQty(it.id),img=it.image||"assets/chinese_placeholder.webp",hasDelta=opts.some(op=>(op.choices||[]).some(ch=>normalizedChoice(ch).delta!==0)),shownPrice=Math.max(0,Number(it.price)+optionMinDelta(opts));return `<div class="menu-row ${it.soldOut?'sold-out':''}">
<div class="dish-photo-wrap">
<img class="dish-photo" src="${escapeHtml(img)}" alt="${escapeHtml(it.name)}" loading="lazy" onerror="this.onerror=null;this.src='assets/chinese_placeholder.webp'">
<span class="image-badge ${it.imageExact?'exact':''}">${it.imageExact?'店内写真':'イメージ'}</span>
</div>
<div class="info">
<div class="name">${escapeHtml(it.name)}</div>${it.desc?`<div class="desc">${escapeHtml(it.desc)}</div>`:""}<div class="price">&yen;${shownPrice.toLocaleString()}${hasDelta?'〜':""}</div>${opts.length?`<span class="option-hint">辛さ・サイズなどを選べます</span>`:""}</div>${it.soldOut?`<div class="sold-out-tag">売り切れ</div>`:opts.length?`<button class="add-option-btn" data-opt="${it.id}">選んで追加<span class="mini-count">選択中 ${q}点</span>
</button>`:`<div class="qty-stepper">
<button data-minus="${it.id}">−</button>
<div class="n">${q}</div>
<button data-plus="${it.id}">+</button>
</div>`}</div>`}).join("")}</div>`).join("");d.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>addSimple(MENU_INDEX[b.dataset.plus]));d.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>removeSimple(MENU_INDEX[b.dataset.minus]));d.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>openOptionDialog(MENU_INDEX[b.dataset.opt]));return d}
  function openOptionDialog(it){const opts=itemOptions(it),ov=document.createElement("div");ov.className="option-overlay";const groups=opts.map((op,oi)=>{const choices=(op.choices||[]).map(normalizedChoice),def=op.default||choices[0]?.label||"";return `<div class="option-group">
<div class="option-group-title">${escapeHtml(op.name)}</div>
<div class="option-choices">${choices.map((ch,ci)=>`<label class="option-choice">
<input type="radio" name="op${oi}" value="${ci}" ${ch.label===def?'checked':''}>
<span>${escapeHtml(ch.label)}${ch.delta?`<small>${deltaText(ch.delta)}</small>`:""}</span>
</label>`).join("")}</div>
</div>`}).join("");ov.innerHTML=`<div class="option-card">
<h2>${escapeHtml(it.name)}</h2>
<div class="op-price">基本価格 &yen;${Number(it.price).toLocaleString()}</div>${groups}<div class="option-price-preview" id="pricePreview">
</div>
<div class="option-group">
<div class="option-group-title">その他のご要望（任意）</div>
<textarea id="optionNote" class="option-note" maxlength="60" rows="2" placeholder="例：ねぎ少なめ（対応できる範囲）">
</textarea>
</div>
<div class="option-actions">
<button class="btn-secondary" id="cancelOption">キャンセル</button>
<button class="btn-primary" id="addOption">この内容で追加</button>
</div>
</div>`;document.body.appendChild(ov);const calc=()=>{let delta=0;opts.forEach((op,oi)=>{const checked=ov.querySelector(`input[name="op${oi}"]:checked`),idx=checked?Number(checked.value):0;delta+=normalizedChoice((op.choices||[])[idx]).delta});ov.querySelector("#pricePreview").textContent=`選択後：¥${Math.max(0,Number(it.price)+delta).toLocaleString()}`;return delta};ov.querySelectorAll('input[type="radio"]').forEach(x=>x.onchange=calc);calc();ov.querySelector("#cancelOption").onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.querySelector("#addOption").onclick=()=>{const selections={};let totalDelta=0;opts.forEach((op,oi)=>{const checked=ov.querySelector(`input[name="op${oi}"]:checked`),idx=checked?Number(checked.value):0,ch=normalizedChoice((op.choices||[])[idx]);totalDelta+=ch.delta;selections[op.name]=ch.delta?`${ch.label}（${deltaText(ch.delta)}）`:ch.label});const note=ov.querySelector("#optionNote").value.trim();ov.remove();addCartLine(it,selections,note,totalDelta)}}
  function renderCartBar(){const d=document.createElement("div");d.className="cart-bar";d.innerHTML=`<div>
<span class="count">${cartCount()}</span>
<span class="total">&yen;${cartTotal().toLocaleString()}</span>
</div>
<button class="go">注文内容を確認</button>`;d.querySelector(".go").onclick=()=>{state.screen="review";renderCustomer()};return d}
  function renderReview(){const d=document.createElement("div");d.className="review-wrap";d.innerHTML=`<h2>ご注文内容の確認</h2>${cartLines().map(l=>`<div class="review-line">
<div>
<div>${escapeHtml(l.name)} × ${l.qty}</div>${l.optionText?`<div class="review-option">${escapeHtml(l.optionText)}</div>`:""}</div>
<div>&yen;${(l.price*l.qty).toLocaleString()}</div>
</div>`).join("")}<div class="review-total">
<span>合計</span>
<span>&yen;${cartTotal().toLocaleString()}</span>
</div>
<div id="orderError" style="display:none;color:var(--lacquer);font-size:13px;margin-top:10px">送信できませんでした。通信状態をご確認ください。</div>
<button class="btn-primary" id="submitOrder" style="width:100%;margin-top:18px">この内容で注文する</button>
<button class="btn-ghost" id="backToMenu" style="display:block;margin:12px auto">メニューに戻って直す</button>`;d.querySelector("#backToMenu").onclick=()=>{state.screen="menu";renderCustomer()};d.querySelector("#submitOrder").onclick=async e=>{const btn=e.currentTarget;btn.disabled=true;btn.textContent="送信中…";const id="o"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const items=cartLines().map(l=>({id:l.id,name:l.name,qty:l.qty,price:l.price,options:l.selections||{},note:l.note||"",optionText:l.optionText||""}));const order={id,items,total:cartTotal(),status:"new",paid:false,createdAt:Date.now()};if(await createOrder(order)){state.lastOrderId=id;state.cart={};state.screen="confirmed";renderCustomer()}else{d.querySelector("#orderError").style.display="block";btn.disabled=false;btn.textContent="この内容で注文する"}};return d}
  function renderConfirm(){const d=document.createElement("div");d.className="confirm-wrap";const n=state.lastOrderId?state.lastOrderId.slice(-4).toUpperCase():"----";d.innerHTML=`<div style="font-family:var(--font-display);font-size:19px">ご注文を承りました</div>
<div class="confirm-ticket">
<div class="num">No. ${n}</div>
<div class="label">厨房に送信しました</div>
</div>
<button class="btn-ghost" id="more" style="margin-top:20px">追加で注文する</button>`;d.querySelector("#more").onclick=()=>{state.screen="menu";renderCustomer()};return d}
  function escapeHtml(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
  async function init(){app.innerHTML='<div class="loading">メニューを読み込み中…</div>';try{let user=await new Promise(r=>{const u=auth.onAuthStateChanged(x=>{u();r(x)})});if(!user)await auth.signInAnonymously();state.menu=await loadMenu();rebuildIndex(state.menu);state.serviceMode=currentServiceMode();state.activeCat=visibleSections()[0]?.cat||"";renderCustomer();db.ref("menu").on("value",snap=>{if(snap.exists()){state.menu=mergeMenuV3(snap.val());rebuildIndex(state.menu);if(state.screen==="menu")renderCustomer()}});setInterval(()=>{const m=currentServiceMode();if(m!==state.serviceMode){state.serviceMode=m;if(state.screen==="menu")renderCustomer()}},60000)}catch(e){console.error(e);app.innerHTML='<div class="loading">接続に失敗しました。ページを再読み込みしてください。</div>'}}
  init();
})();
</script>
<script src="price-visibility.js"></script>
<script src="menu-view.js"></script>
</body>
