<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お料理メニュー｜福林楼</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');:root{--p:#f7f0e3;--w:#fffdfa;--i:#292017;--r:#8f2b1b;--g:#aa812d;--l:#dfd0b7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:"Noto Sans JP",sans-serif}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.bar{background:var(--r);color:white}.bar .wrap{min-height:62px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:700 1.25rem "Noto Serif JP";text-decoration:none;color:white}.toplink{color:white;text-decoration:none;border:1px solid #ffffff99;border-radius:3px;padding:6px 10px;font-size:.8rem}.intro{padding:32px 0 24px}.tag{color:var(--r);font-size:.72rem;letter-spacing:.2em;font-weight:bold}.intro h1{font:700 clamp(1.8rem,5vw,2.6rem) "Noto Serif JP";margin:5px 0}.intro p{margin:0;color:#67594c;font-size:.9rem}.notice{margin-top:14px;padding:10px 13px;border-left:4px solid var(--g);background:#fff9ef;font-size:.85rem}.tabs{border-block:1px solid var(--l);background:#fdf7ec;position:sticky;top:0;z-index:5}.tabs .wrap{display:flex;gap:7px;overflow:auto;padding:10px 0}.tabs button,.move button{font:inherit;cursor:pointer;white-space:nowrap;border:1px solid var(--l);background:var(--w);border-radius:999px;padding:6px 12px;font-size:.8rem}.tabs button:hover,.move button:hover{border-color:var(--r);color:var(--r)}main{padding:26px 0 46px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--l);background:var(--w);padding:0;text-align:left;cursor:pointer;overflow:hidden}.card img{display:block;width:100%;aspect-ratio:1.15;object-fit:cover;object-position:top}.card div{padding:11px 12px}.card b{font-family:"Noto Serif JP";font-size:1rem}.card span{display:block;font-size:.75rem;color:#78695b;margin-top:2px}.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #4c30121a}.detail{display:none}.detail.show{display:block}.back{margin-bottom:14px}.back button{border:0;background:none;padding:0;color:var(--r);font-weight:bold;cursor:pointer}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:4px 0 12px}.detail h2{font:700 1.5rem "Noto Serif JP";margin:0}.detail img{width:100%;display:block;border:1px solid var(--l);background:white}.move{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.priceOff{display:none;margin:0 0 12px;padding:10px;background:#fff9ef;border:1px solid #dec887;font-size:.83rem}.hide .priceOff{display:block}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card div{padding:9px}.card b{font-size:.9rem}.intro{padding-top:25px}.detail h2{font-size:1.25rem}}
</style></head><body><header class="bar"><div class="wrap"><a class="brand" href="./index.html">福林楼</a><a class="toplink" href="./index.html">ホームへ</a></div></header><section class="intro"><div class="wrap"><div class="tag">FOOD MENU</div><h1>お料理メニュー</h1><p>閲覧専用です。ご注文・ご予約はお電話で承ります。</p><div class="notice" id="note"></div></div></section><nav class="tabs"><div class="wrap" id="tabs"></div></nav><main class="wrap"><div class="priceOff">現在は価格を掲載していません。内容は店舗へお問い合わせください。</div><section id="list"><div class="grid" id="grid"></div></section><section class="detail" id="detail"><p class="back"><button onclick="showList()">← メニュー一覧へ</button></p><div class="detail-head"><h2 id="title"></h2><span id="sub"></span></div><img id="image" alt=""><div class="move"><button id="prev">← 前のメニュー</button><button id="next">次のメニュー →</button></div></section></main><script>
// ===== 価格表示の設定：ここだけを書き換えてください =====
const SHOW_PRICES=true; // true：表示　false：非表示
const pages=[['dim-sum','点心','自家製の点心','dim-sum.jpg'],['appetizers','前菜類','前菜・おつまみ','appetizers.jpg'],['main-1','主菜①','海鮮・肉料理','main-1.jpg'],['main-2','主菜②','海鮮・肉料理','main-2.jpg'],['vegetables','野菜・スープ・デザート','野菜料理・甘味','vegetables-soup-dessert.jpg'],['drinks','お酒・ドリンク①','サワー・果実酒など','drinks-1.jpg'],['drinks-2','お酒・ドリンク②','ビール・焼酎・中国酒','drinks-2.jpg'],['course-drink','飲み放題','飲み放題メニュー','course-drink.jpg'],['course','コース料理','福林・招福・家族コース','course.jpg']];
const folder=SHOW_PRICES?'assets/menu/price/':'assets/menu/no-price/';let current=0;
const q=id=>document.getElementById(id);if(!SHOW_PRICES){document.body.classList.add('hide');q('note').textContent='現在、価格は掲載していません。';}else q('note').textContent='表示価格は税込みです。';
pages.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p[1];b.onclick=()=>show(i);q('tabs').append(b);let c=document.createElement('button');c.className='card';c.innerHTML='<img src="'+folder+p[3]+'" alt="'+p[1]+'"><div><b>'+p[1]+'</b><span>'+p[2]+'</span></div>';c.onclick=()=>show(i);q('grid').append(c);});
function show(i){current=(i+pages.length)%pages.length;let p=pages[current];q('title').textContent=p[1];q('sub').textContent=p[2];q('image').src=folder+p[3];q('image').alt='福林楼 '+p[1]+'メニュー';q('list').style.display='none';q('detail').classList.add('show');history.replaceState(null,'','#'+p[0]);window.scrollTo({top:0,behavior:'smooth'});}
function showList(){q('detail').classList.remove('show');q('list').style.display='block';history.replaceState(null,'','#menu');window.scrollTo({top:0,behavior:'smooth'});}
q('prev').onclick=()=>show(current-1);q('next').onclick=()=>show(current+1);let initial=pages.findIndex(p=>p[0]===location.hash.slice(1));if(initial>=0)show(initial);
</script></body></html>
